syntax = "proto2";

package com.android.onboarding.arp;

import "wireless/android/apps/wtfbug/system_data.proto";

extend wireless.android.apps.wtfbug.SystemData {
  optional OnboardingSystemData onboarding_system_data = 5002;
}

// Android Onboarding specific data for ARP.
message OnboardingSystemData {
  optional string persist_system_log = 1;
}
